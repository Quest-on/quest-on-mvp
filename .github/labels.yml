# 라벨 원본. 적용: node scripts/sync-labels.mjs
# 축은 3개뿐이다: type(무엇) / status(누가 집을 수 있나) / area(어디).
- name: "type:epic"
  color: "5319E7"
  description: "스프린트 단위 기능 묶음"
- name: "type:feature"
  color: "0E8A16"
  description: "새 기능 단위 스펙"
- name: "type:bug"
  color: "D73A4A"
  description: "재현 가능한 결함"
- name: "type:chore"
  color: "BFD4F2"
  description: "정리/기술부채/설정"

- name: "status:needs-spec"
  color: "FBCA04"
  description: "스펙이 모호함. 에이전트가 집으면 안 됨"
- name: "status:ready"
  color: "0075CA"
  description: "스펙 확정. 에이전트가 바로 구현 가능"
- name: "status:in-progress"
  color: "C5DEF5"
  description: "작업 중 (브랜치 존재)"
- name: "status:blocked"
  color: "B60205"
  description: "외부 의존/결정 대기"

- name: "area:onboarding"
  color: "E4E669"
  description: "가입·역할선택·첫 사용 경험"
- name: "area:authoring"
  color: "E4E669"
  description: "시험/과제 출제"
- name: "area:exam"
  color: "E4E669"
  description: "학생 응시 플로우"
- name: "area:grading"
  color: "E4E669"
  description: "채점/피드백 파이프라인"
- name: "area:platform"
  color: "E4E669"
  description: "인증·DB·CI·인프라"

- name: "risk:high"
  color: "B60205"
  description: "인증/권한/마이그레이션/과금 경로"
