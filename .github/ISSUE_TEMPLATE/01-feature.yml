name: "Feature — 기능 스펙"
description: "에이전트가 바로 구현할 수 있는 단위 기능 스펙. 이슈 1개 = PR 1개."
title: "feat: "
labels: ["type:feature", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 **스펙**입니다. 에이전트는 이 본문만 읽고 구현합니다.
        모호하면 여기서 멈추고 `status:needs-spec` 으로 두세요. 코드부터 짜지 않습니다.

  - type: input
    id: epic
    attributes:
      label: 상위 Epic
      description: "스프린트 단위 Epic 이슈 번호. 없으면 `none`."
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 사용자 시나리오
      description: "누가, 언제, 무엇을 하려다 막히는가. 시나리오 없는 기능은 만들지 않습니다."
      placeholder: |
        교수자가 가입 직후 대시보드에 들어왔는데 시험이 0개라 무엇을 먼저 눌러야 할지 모른다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 인수 조건 (Acceptance Criteria)
      description: |
        검증 가능한 문장만. 형식: `WHEN <조건> THEN <시스템이 하는 일>`.
        UI 문구/색 같은 취향은 여기 쓰지 않습니다.
      value: |
        - [ ] WHEN 역할이 없는 사용자가 `/`에 접근 THEN `/onboarding`으로 리다이렉트된다
        - [ ] WHEN ... THEN ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위 / 비범위
      description: "비범위를 반드시 적으세요. 에이전트 스코프 확장의 유일한 브레이크입니다."
      value: |
        **범위**
        -

        **비범위 (이번 PR에서 안 함)**
        -
    validations:
      required: true

  - type: textarea
    id: touchpoints
    attributes:
      label: 예상 변경 지점
      description: "파일·라우트·테이블. 병렬 작업 시 충돌 방지용이라 대충이라도 적습니다."
      value: |
        - 파일/라우트:
        - DB/마이그레이션: 없음
        - 외부 API/비용 영향: 없음
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법 (에이전트가 실행할 명령)
      description: "사람이 눈으로 보는 것 말고, 통과/실패가 찍히는 것. 최소 1개는 새로 추가되는 테스트여야 합니다."
      value: |
        ```bash
        npx tsc --noEmit && npm run lint
        npx vitest run __tests__/<파일>
        ```
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: 리스크
      options:
        - "low — UI/문구, 롤백 즉시 가능"
        - "medium — 서버 로직·쿼리 변경"
        - "high — 인증/권한/마이그레이션/과금 경로"
      default: 0
    validations:
      required: true
