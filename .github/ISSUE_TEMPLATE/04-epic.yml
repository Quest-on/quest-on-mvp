name: "Epic — 스프린트 단위 기능"
description: "한 스프린트에서 끝내는 기능 묶음. 하위 이슈들의 부모."
title: "epic: "
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        Epic 은 **코드를 담지 않습니다.** 여기서 결정하고, 하위 Feature 이슈에서 구현합니다.

  - type: textarea
    id: goal
    attributes:
      label: 목표와 성공 지표
      description: "지표는 숫자로. '좋아진다'는 지표가 아닙니다."
      value: |
        - 목표:
        - 성공 지표: (예) 가입한 교수자의 60%가 7일 내 첫 시험을 발행한다
    validations:
      required: true

  - type: textarea
    id: journey
    attributes:
      label: 사용자 여정
      description: "진입 → 각 단계 → 성공 상태. 단계마다 이탈 지점을 표시하세요."
    validations:
      required: true

  - type: textarea
    id: nongoals
    attributes:
      label: 이번 스프린트에서 안 하는 것
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: 하위 이슈
      description: "쪼갤 때 기준은 '파일이 겹치지 않는가'. 겹치면 순서를 명시하세요."
      value: |
        - [ ] #
        - [ ] #
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] 하위 이슈 전부 머지
        - [ ] E2E 플로우 1개가 여정 전체를 커버
        - [ ] 지표 계측(이벤트/로그) 반영
    validations:
      required: true
