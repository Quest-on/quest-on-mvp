name: "Test Setup"
description: "Common setup for API and browser E2E tests"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    # `latest`는 실행마다 GitHub API 릴리스를 조회해 공유 IP rate limit에 걸린다.
    # 2026-08-08의 최근 안정판으로 고정하며, 로컬 스택을 갱신할 때 검증 후 함께 올린다.
    - uses: supabase/setup-cli@v1
      with:
        version: 2.113.0

    - name: Verify local Supabase project config
      run: |
        if [ ! -f supabase/config.toml ]; then
          echo "supabase/config.toml 이 없다. 로컬 스택을 재현할 수 없다." >&2
          exit 1
        fi
      shell: bash

    - run: supabase start
      shell: bash

    # DB 안전 멈춤 규칙의 preflight가 요구하는 폐기 로컬 DB 증거를 러너에만 만든다.
    - name: Create disposable local .env.test
      run: |
        ANON_KEY="$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
        SERVICE_KEY="$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"
        {
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_KEY}"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "DISPOSABLE_LOCAL_DB_CONFIRMED=1"
        } > .env.test
        echo "DISPOSABLE_LOCAL_DB_CONFIRMED=1" >> "$GITHUB_ENV"
      shell: bash

    - run: npm ci
      shell: bash

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash

    - name: Install Playwright system deps (cached)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
      shell: bash

    - name: Enable pgvector extension
      run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
      shell: bash

    - name: Push Prisma schema to local DB
      run: npx prisma db push --accept-data-loss
      shell: bash
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    - name: Create non-Prisma tables
      run: |
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "
          CREATE TABLE IF NOT EXISTS instructor_profiles (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL DEFAULT '',
            email TEXT NOT NULL DEFAULT '',
            school TEXT,
            status TEXT NOT NULL DEFAULT 'pending',
            created_at TIMESTAMPTZ DEFAULT now(),
            updated_at TIMESTAMPTZ DEFAULT now()
          );

          -- profiles: Supabase Auth 사용자 프로필(role/status/display_name/avatar_url).
          -- Prisma 스키마 밖(Supabase 관리 테이블)이라 prisma db push 로 생성되지 않는다.
          -- 앱의 인증(lib/supabase-auth.ts)·유저 조회(lib/app-users.ts)가 이 테이블을 읽어,
          -- 없으면 PGRST205: public.profiles 테이블을 찾지 못해 조회가 실패한다.
          CREATE TABLE IF NOT EXISTS profiles (
            id TEXT PRIMARY KEY,
            role TEXT NOT NULL DEFAULT 'student',
            status TEXT NOT NULL DEFAULT 'approved',
            display_name TEXT,
            avatar_url TEXT,
            created_at TIMESTAMPTZ DEFAULT now(),
            updated_at TIMESTAMPTZ DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS error_logs (
            id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
            level TEXT NOT NULL DEFAULT 'error',
            message TEXT NOT NULL,
            payload JSONB,
            path TEXT,
            user_id TEXT,
            created_at TIMESTAMPTZ DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS audit_logs (
            id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
            action TEXT NOT NULL,
            user_id TEXT NOT NULL,
            target_id TEXT NOT NULL,
            details JSONB,
            created_at TIMESTAMPTZ DEFAULT now() NOT NULL
          );

          CREATE TABLE IF NOT EXISTS paste_logs (
            id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
            session_id UUID NOT NULL,
            exam_code TEXT,
            question_id TEXT,
            length INT,
            pasted_text TEXT,
            paste_start INT,
            paste_end INT,
            answer_length_before INT,
            is_internal BOOLEAN NOT NULL DEFAULT false,
            suspicious BOOLEAN NOT NULL DEFAULT false,
            timestamp TIMESTAMPTZ NOT NULL,
            created_at TIMESTAMPTZ DEFAULT now()
          );

          -- grades.updated_at: required by grade upsert handler but not in Prisma schema
          ALTER TABLE grades ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ DEFAULT NOW();

          -- sessions: late entry columns (added via database/add_late_entry_columns.sql, not in Prisma schema)
          ALTER TABLE sessions ADD COLUMN IF NOT EXISTS late_entry_approved_at TIMESTAMPTZ DEFAULT NULL;
          ALTER TABLE sessions ADD COLUMN IF NOT EXISTS late_entry_denied_at TIMESTAMPTZ DEFAULT NULL;
        "
      shell: bash

    - name: Apply SQL functions (RPCs) and security migrations
      run: |
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -f database/016_chat_message_idempotency.sql \
          -f sql/006_submit_exam_atomic.sql \
          -f sql/007_index_optimization.sql \
          -f sql/012_create_exam_with_node.sql
        # 018 은 RLS/REVOKE 를 포함한다. 여기서 적용하지 않으면 plan_limits 가
        # 아래 blanket GRANT 아래에서 RLS 없이 남아, CI 만 운영과 다른 보안 상태가
        # 된다(전역 한도 테이블을 anon 이 수정 가능). 컬럼/테이블 생성은 전부
        # IF NOT EXISTS 라 prisma db push 와 중복돼도 안전하다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/018_onboarding_activation.sql
        # 019 도 raw profiles 테이블의 RLS와 권한을 고정한다. 적용하지 않으면 아래
        # blanket GRANT가 CI에서만 직접 PATCH를 다시 열어 운영 보안 검증이 무력화된다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/019_profiles_rls.sql
        # 021 은 승인 대기(pending)로 굳은 기존 계정을 푼다. CI 의 raw DDL 은
        # instructor_profiles.status 를 여전히 'pending' 기본값으로 만들기 때문에,
        # 이걸 적용하지 않으면 CI 에서만 승인 대기 계정이 살아남아 운영과 갈라진다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/021_clear_pending_status.sql
        # 022 는 교수자 데모 응시가 남긴 학생 퍼널 오염을 지운다. 코드 수정과
        # 짝이라 CI 에서도 같이 적용해야 운영과 같은 상태가 된다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/022_clean_demo_preview_metrics.sql
        # 023 은 데모 재응시를 원자적으로 처리하는 RPC 다. 적용하지 않으면
        # 재응시 호출이 CI 에서만 함수 없음으로 실패한다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/023_restart_demo_attempt.sql
        # 024 는 발행/학생 한도를 원자적으로 강제하는 RPC 다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/024_admit_exam_session.sql
        # 025 는 동의 원장의 RLS·REVOKE·append-only trigger·RPC 를 만든다.
        # Prisma 는 trigger/RLS/함수를 표현하지 못하므로 prisma db push 로는
        # 절대 생기지 않는다. 여기서 적용하지 않으면 CI 는 append-only 가
        # 강제되지 않는 DB 에서 돌아 운영과 다른 결과를 낸다.
        # 최초 정책 릴리스 seed(026)는 PR3 이 소유한다 — 여기서 참조하지 않는다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/025_consent_records.sql
        # 026 은 데모 우회 범위·승인 반환값·SECURITY DEFINER PUBLIC 노출을 막는다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/026_close_quota_gaps.sql
        # Consent policy seed is renumbered by the follow-up commit in this PR.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/020_seed_consent_policy_release.sql
        # Reload PostgREST schema cache so new functions are immediately callable
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -c "NOTIFY pgrst, 'reload schema';"
      shell: bash

    # Tables created via `prisma db push` and the raw CREATE TABLE block are owned by
    # `postgres` and carry no grants for the Supabase API roles. Without these grants the
    # running app (which queries through PostgREST as service_role/authenticated) hits
    # "permission denied for table ..." on audit_logs, ai_events, exam_grading_sessions,
    # bulk_grading_messages, etc. Grant the standard Supabase roles on everything now that
    # all tables/sequences/routines exist. Run last so nothing is missed.
    - name: Grant privileges to Supabase API roles
      run: |
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL ROUTINES IN SCHEMA public TO anon, authenticated, service_role;
          -- 이 blanket GRANT 는 018·019·025 가 건 REVOKE 를 되돌린다. plan_limits와
          -- onboarding_events는 service_role 전용이고, profiles는 자기 행 SELECT만
          -- 허용한다. 다시 회수하지 않으면 CI에서만 직접 PATCH가 열려 판단을 그르친다.
          REVOKE ALL ON public.plan_limits FROM anon, authenticated;
          REVOKE ALL ON public.onboarding_events FROM anon, authenticated;
          REVOKE ALL ON public.profiles FROM anon, authenticated;
          GRANT SELECT ON public.profiles TO anon, authenticated;
          -- SECURITY DEFINER 함수도 blanket GRANT 에 함께 열린다. 열린 채 두면
          -- 인증된 학생이 admit_exam_session 을 직접 불러 임의 student_id 로
          -- 세션을 만들거나 restart_demo_attempt 로 남의 제출을 지울 수 있다.
          -- CI 만 운영과 다른 보안 상태가 되어 검증이 무의미해진다.
          REVOKE ALL ON FUNCTION public.admit_exam_session(uuid, text, text, text) FROM anon, authenticated;
          REVOKE ALL ON FUNCTION public.restart_demo_attempt(uuid, text) FROM anon, authenticated;
          -- 동의 원장 등 다른 SECURITY DEFINER 함수도 blanket GRANT 에 함께 열린다.
          -- 다시 회수하지 않으면 CI 에서만 임의 매핑 선점·purge 호출이 열려,
          -- 운영과 다른 보안 상태로 검증이 무의미해진다.
          -- 동의 원장 RPC 도 SECURITY DEFINER 다. blanket GRANT 뒤 다시 회수하지
          -- 않으면 CI 에서만 임의 매핑 선점·purge 호출이 열려 검증이 무의미해진다.
          -- (DO 블록은 셸의 달러 확장과 충돌하므로 파일로 적용한다.)
          -- 025 의 consent 테이블도 같은 이유로 다시 회수한다.
          -- 매핑과 보존 인덱스는 service_role 직접 접근도 막는다(RPC 로만 접근).
          REVOKE ALL ON public.consent_records FROM anon, authenticated;
          REVOKE ALL ON public.consent_subject_map FROM anon, authenticated;
          REVOKE ALL ON public.consent_policy_releases FROM anon, authenticated;
          REVOKE ALL ON public.consent_retention_index FROM anon, authenticated;
          REVOKE ALL ON public.consent_purge_runs FROM anon, authenticated;
          REVOKE ALL ON public.consent_subject_map FROM service_role;
          REVOKE ALL ON public.consent_retention_index FROM service_role;
          NOTIFY pgrst, 'reload schema';
        "
        # blanket GRANT 가 SECURITY DEFINER 함수까지 다시 열었다. 026 을 재적용해
        # 권한을 원래대로 회수한다 — 함수 정의는 멱등(CREATE OR REPLACE)이다.
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -v ON_ERROR_STOP=1 \
          -f database/026_close_quota_gaps.sql
        psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          -c "NOTIFY pgrst, 'reload schema';"
      shell: bash
