name: CI

on:
  push:
    branches: [main, staging]
  # base 를 제한하지 않는다. 스택 PR(작업 브랜치 위에 쌓은 PR)의 base 는 staging 도
  # main 도 아니라서, 목록으로 제한하면 그 PR 들만 CI 없이 머지되는 구멍이 생긴다.
  pull_request:

# 같은 커밋에 대한 CI 를 두 벌 **동시에** 돌리지 않는다.
#
# staging 에 푸시하면 (1) push 이벤트와 (2) 상시 열려 있는 staging -> main PR 의
# pull_request: synchronize 가 각각 CI 를 띄운다. 둘이 같은 러너 자원(Supabase
# 컨테이너·Next 서버·목 서버·포트)을 두고 경쟁하면서 Browser E2E 가
# page.waitForLoadState 타임아웃으로 죽었다. 재현율 2/2 로 매번 push 런만 죽었다.
#
# cancel-in-progress 를 false 로 두는 이유: deploy.yml 이 CI 런의 conclusion 이
# success 일 때만 배포한다. 먼저 시작한 런을 취소하면 그 런의 결론이 cancelled 이
# 되어 배포가 건너뛰어진다. 뒤에 온 쪽이 기다리는 편이 맞다.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # staging/main 이 head 인 PR(상시 열린 staging -> main PR)은 건너뛴다.
    # 그 커밋은 push 트리거가 이미 같은 SHA 로 검증하므로 커버리지 손실이 없고,
    # 두 벌이 동시에 도는 것이 Browser E2E 를 죽이던 원인이었다.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["main","staging"]'), github.event.pull_request.head.ref)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - name: Verify consent policy release hash
        run: npx tsx scripts/consent-policy-release.ts --verify database/027_seed_consent_policy_release.sql
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    # staging/main 이 head 인 PR(상시 열린 staging -> main PR)은 건너뛴다.
    # 그 커밋은 push 트리거가 이미 같은 SHA 로 검증하므로 커버리지 손실이 없고,
    # 두 벌이 동시에 도는 것이 Browser E2E 를 죽이던 원인이었다.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["main","staging"]'), github.event.pull_request.head.ref)
    timeout-minutes: 12
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 빌드는 항상 실제로 돈다.
      # 예전에는 시크릿이 없으면 next build 를 통째로 건너뛰고 job 을 성공으로 끝냈다.
      # 그러면 빌드가 깨진 코드가 초록불을 받는다 — 게이트가 아니라 장식이 된다.
      #
      # NEXT_PUBLIC_* 은 빌드 시 번들에 인라인되어 브라우저에 그대로 노출되므로 애초에 비밀이 아니다.
      # next build 는 이 값들의 "존재"만 필요하고 실제 접속은 하지 않으므로, E2E job 과 동일한
      # 더미 값으로 빌드한다. 시크릿 설정 여부·포크 PR 여부와 무관하게 항상 동작한다.
      #
      # 진짜 프로덕션 환경변수 조합의 빌드는 Vercel 이 배포 때 검증한다.
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WO_o0BQXj0V_fMnZXz7cz0yd2V0j2xN7OIRI
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          OPENAI_API_KEY: ci-build-key
          ADMIN_USERNAME: ci-build-admin
          ADMIN_PASSWORD: ci-build-password
          ADMIN_SESSION_SECRET: ci-build-secret-for-hmac-signing-minimum-32-chars

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # staging/main 이 head 인 PR(상시 열린 staging -> main PR)은 건너뛴다.
    # 그 커밋은 push 트리거가 이미 같은 SHA 로 검증하므로 커버리지 손실이 없고,
    # 두 벌이 동시에 도는 것이 Browser E2E 를 죽이던 원인이었다.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["main","staging"]'), github.event.pull_request.head.ref)
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  api-integration-test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    # staging/main 이 head 인 PR(상시 열린 staging -> main PR)은 건너뛴다.
    # 그 커밋은 push 트리거가 이미 같은 SHA 로 검증하므로 커버리지 손실이 없고,
    # 두 벌이 동시에 도는 것이 Browser E2E 를 죽이던 원인이었다.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["main","staging"]'), github.event.pull_request.head.ref)
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      - name: Run API integration tests
        run: |
          mkdir -p test-results
          npx playwright test --project=api-integration --config=e2e/playwright.config.ts
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/api-results.xml
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WO_o0BQXj0V_fMnZXz7cz0yd2V0j2xN7OIRI
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OPENAI_API_KEY: test-key
          OPENAI_BASE_URL: http://localhost:4010/v1
          ADMIN_USERNAME: test-admin
          ADMIN_PASSWORD: test-password
          ADMIN_SESSION_SECRET: test-secret-for-hmac-signing-minimum-32-chars
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          TEST_BYPASS_SECRET: e2e-test-bypass-token-2024
          INTERNAL_API_SECRET: test-internal-api-secret-ci
          NEXT_PUBLIC_TEST_BYPASS_ENABLED: "true"
          CONSENT_GATE_MODE: prompt
          CONSENT_SUBJECT_HMAC_KEY_V1: ci-only-consent-hmac-key-at-least-32-bytes
          CRON_SECRET: ci-only-cron-secret-at-least-32-bytes
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-results/api-results.xml

  browser-e2e-test:
    # 뼈대(smoke/a11y/CSP/error-boundary)와 개인정보 동의 actual-auth flow를
    # 필수 게이트로 둔다. 나머지 browser-flows는 UI 변경 민감도가 높아 로컬 전용이다.
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    # 위 잡들과 같은 이유로 중복 실행을 건너뛴다.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["main","staging"]'), github.event.pull_request.head.ref)
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-setup
      - name: Run browser E2E tests
        run: |
          mkdir -p test-results junit
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=junit/browser-results.xml \
            npx playwright test --project=browser-e2e --config=e2e/playwright.config.ts
          CONSENT_GATE_MODE=prompt \
            CONSENT_SUBJECT_HMAC_KEY_V1=ci-only-consent-hmac-key-at-least-32-bytes \
            CRON_SECRET=ci-only-cron-secret-at-least-32-bytes \
            PLAYWRIGHT_JUNIT_OUTPUT_NAME=junit/consent-flow-results.xml \
            npx playwright test e2e/browser/flows/consent-onboarding-flow.spec.ts \
              --project=browser-flows --config=e2e/playwright.config.ts
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WO_o0BQXj0V_fMnZXz7cz0yd2V0j2xN7OIRI
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OPENAI_API_KEY: test-key
          OPENAI_BASE_URL: http://localhost:4010/v1
          ADMIN_USERNAME: test-admin
          ADMIN_PASSWORD: test-password
          ADMIN_SESSION_SECRET: test-secret-for-hmac-signing-minimum-32-chars
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          TEST_BYPASS_SECRET: e2e-test-bypass-token-2024
          INTERNAL_API_SECRET: test-internal-api-secret-ci
          NEXT_PUBLIC_TEST_BYPASS_ENABLED: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser
          path: |
            playwright-report/
            test-results/
            junit/
          retention-days: 7
      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit/*.xml
