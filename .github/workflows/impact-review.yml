name: impact-review

# 변경 영향/회귀 자동 리뷰. PR + main 직푸시 둘 다에서 발동 (준형 직푸시 커버).
# 결정적 Critical → job 실패(빨간 체크). AI-only Critical → 기본 코멘트-only.
# read-only: Supabase/DB/.env 미전달. pull_request_target 사용 금지.
on:
  pull_request:
    branches: [main, yeongjun]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write # push 이벤트의 commit comment용
  issues: write # PR 코멘트용
  pull-requests: write # PR 코멘트 작성

concurrency:
  group: impact-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  impact-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 코딩 구독(GLM Coding Plan)은 raw API를 거부하고 화이트리스트 코딩 CLI에서만 동작.
      # 그래서 모델 2차 리뷰는 opencode 헤드리스를 경유한다(.github/impact-review/opencode.json).
      - name: Install opencode (whitelisted coding agent)
        run: npm install -g opencode-ai@1.17.6 # 핀 고정(재현성; DEPENDENCY_POLICY 준수)
      - name: Run impact review (opencode / GLM Coding Plan)
        run: npm run impact-review -- --event github --post-github-comment --ci --provider opencode --threshold 80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # opencode가 읽는 coding-plan 설정: provider/baseURL/model은 opencode.json, 키는 아래 secret.
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/impact-review/opencode.json
          ZAI_CODING_API_KEY: ${{ secrets.ZAI_CODING_API_KEY }}
          IMPACT_REVIEW_PROVIDER: opencode
          IMPACT_REVIEW_AGENT_MODEL: zai-coding/glm-5.2 # 최신 플래그십(1M ctx 변형은 glm-5.2[1m])
          # 키/opencode 미가용 시 자동으로 결정적-only로 떨어지고, 결정적 Critical은 그대로 job 실패시킴.
