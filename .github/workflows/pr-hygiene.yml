name: pr-hygiene

# PR 본문이 추적 사슬을 실제로 잇는지 검사한다.
#
# 왜 필요한가: `.github/PULL_REQUEST_TEMPLATE.md` 는 `Closes #` 를 기본값으로 두는데,
# 작성자가 번호를 안 채워도 GitHub 은 PR 을 받아준다. ci.yml 은 본문을
# 보지 않는다. 이 저장소는 사람 리뷰어가 없으므로 아무도 못 잡고,
# 이슈에 연결되지 않은 변경이 그대로 머지된다. docs/WORKFLOW.md 가 말하는
# "제목이 아니라 본문의 Closes #<번호> 가 추적의 실체다" 를 강제하는 게이트다.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  issue-link:
    name: PR Issue Link
    runs-on: ubuntu-latest
    steps:
      - name: Require a resolved issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 이슈 없이 진행해야 하는 예외는 명시적으로 선언하게 한다.
          # 조용히 빈칸으로 두는 것과 "왜 없는지" 적는 것은 다르다.
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*No issue:[[:space:]]*\S'; then
            echo "✅ 'No issue:' 사유가 명시되어 통과합니다."
            exit 0
          fi

          if printf '%s' "$PR_BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "✅ 이슈 참조를 찾았습니다."
            exit 0
          fi

          echo "::error::PR 본문에 이슈 참조가 없습니다."
          echo ""
          echo "다음 중 하나를 본문에 넣으세요:"
          echo "  Closes #123        (Fixes / Resolves 도 가능)"
          echo "  No issue: <이유>   (이슈 없이 가야 하는 경우)"
          echo ""
          echo "템플릿의 'Closes #' 를 번호 없이 그대로 두면 이 검사에 걸립니다."
          echo "docs/WORKFLOW.md — 추적 사슬은 본문의 Closes #<번호> 가 실체입니다."
          exit 1
