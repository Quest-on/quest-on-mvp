name: Browser Flows (nightly)

# e2e/browser/flows/ 를 매일 한 번 돌린다 — 관측용이지 게이트가 아니다 (이슈 #482).
#
# 왜 게이트가 아닌가: flows 는 data-testid 와 클릭 순서에 물려 있어 UI 를 건드릴
# 때마다 깨진다. 머지를 막으면 "테스트가 깨졌으니 테스트를 지운다" 로 간다
# (docs/TESTING.md). 그렇다고 아무 데서도 안 돌리면 — 실제로 그랬다 — 테스트가
# 잡고 있던 버그도 아무도 모른다. 한 번 돌려 보니 실패 9건 중 5건이 실제 버그였다
# (#474 preflight 두 번, #480 프로필 폼 도달 불가).
#
# 왜 ci.yml 이 아니라 별도 파일인가: ci.yml 은 PR·push 게이트이고 그 구조를 고정하는
# 단위 테스트가 있다(ci-action-pins, ci-workflow-concurrency, deploy-trigger).
# 관측 잡은 트리거도 성격도 다르다.
#
# schedule 은 기본 브랜치(main)의 이 파일로만 등록된다. 그래도 받는 코드는
# staging 이다 — 승격 **전에** 깨진 걸 보는 게 목적이다.

on:
  schedule:
    # 매일 03:17 KST (18:17 UTC). 정각을 피한다.
    - cron: "17 18 * * *"
  # flows 를 건드리는 PR 에서도 돈다. 필수 검사가 아니다 — 깨졌다는 신호만 준다.
  pull_request:
    paths:
      - ".github/workflows/flows-nightly.yml"
      - "e2e/browser/flows/**"
      - "e2e/browser/helpers/**"
      - "e2e/browser/pages/**"
      - "e2e/helpers/seed.ts"
  workflow_dispatch:
    inputs:
      ref:
        description: "테스트할 브랜치"
        required: false
        default: staging

permissions:
  contents: read

concurrency:
  group: flows-nightly-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  browser-flows:
    name: Browser Flows (observe only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 에서는 그 PR 의 코드를, 야간·수동 실행에서는 staging 을 본다.
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.inputs.ref || 'staging' }}
      - uses: ./.github/actions/test-setup
      # 동의 온보딩 flow 는 ci.yml 의 consent-flow-test 가 게이트로 돈다 — 여기서 빼면
      # 같은 실행 안에서 서로의 데이터를 건드리지 않는다.
      - name: Run browser flows
        run: |
          mkdir -p test-results junit
          specs=$(ls e2e/browser/flows/*.spec.ts | grep -v consent-onboarding-flow)
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=junit/flows-nightly-results.xml \
            npx playwright test $specs \
              --project=browser-flows --config=e2e/playwright.config.ts
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WO_o0BQXj0V_fMnZXz7cz0yd2V0j2xN7OIRI
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OPENAI_API_KEY: test-key
          OPENAI_BASE_URL: http://localhost:4010/v1
          ADMIN_USERNAME: test-admin
          ADMIN_PASSWORD: test-password
          ADMIN_SESSION_SECRET: test-secret-for-hmac-signing-minimum-32-chars
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          TEST_BYPASS_SECRET: e2e-test-bypass-token-2024
          INTERNAL_API_SECRET: test-internal-api-secret-ci
          NEXT_PUBLIC_TEST_BYPASS_ENABLED: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-flows-nightly
          path: |
            playwright-report/
            test-results/
            junit/
          retention-days: 14
      - name: Test Summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          node scripts/ci-test-summary.mjs junit/*.xml
