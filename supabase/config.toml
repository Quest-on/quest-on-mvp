# 로컬 Supabase 스택 설정.
#
# 이 파일이 없으면 `supabase start` 가 프로젝트를 인식하지 못해
# 로컬 스택을 띄울 수 없다. CI 의 test-setup composite action 도
# `supabase start` 를 부르므로, 이 배선이 없으면 CI 에서도 재현되지 않는다.
#
# 포트는 e2e preflight(`e2e/helpers/assert-local-test-env.ts`)와
# test-setup action 이 쓰는 값과 맞춘다. 여기서 바꾸면 그쪽도 함께 바꿔야 한다.
#
# ⚠️ 이 스택은 폐기 가능한 로컬 전용이다. 실서비스 자격증명을 넣지 않는다.

project_id = "quest-on-mvp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# 로컬 메일 캐처. e2e 의 이메일 확인 링크 fixture 가 이 포트를 읽는다.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# 로컬에서는 확인 메일이 Mailpit 으로 간다. 실제 발송은 없다.
enable_confirmations = true
secure_password_change = false

# Google 버튼 E2E 전용 OIDC adapter. GoTrue의 built-in Google provider는
# issuer가 하드코딩돼 URL override가 불가능하다. 브라우저 테스트가 로컬에서만
# provider=keycloak 으로 authorize 요청을 바꾸고, 실제 PKCE/callback 흐름은
# 그대로 탄다. 값은 로컬 전용 공개 dummy 자격증명이다.
[auth.external.keycloak]
enabled = true
client_id = "local-google-stub"
secret = "local-google-stub-secret"
url = "http://host.docker.internal:4010/oauth/keycloak"
redirect_uri = ""
[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
